# Daily check in GitHub Actions: runs the tests every day and on every push.
#
# The pipeline itself runs on the machine that hosts the review app (see
# schedule/crontab.txt), because both need the same sync_state.db: that file is
# what remembers approvals and rejections. It holds CRM data, so it is never
# committed to this public repo (.gitignore). In production I'd move that state
# to a private shared database and run the pipeline from here too.
name: daily-check

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC, before reviewers start
  push:
  workflow_dispatch: {}

concurrency: daily-check

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
