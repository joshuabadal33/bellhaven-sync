# Daily run of the pipeline. Not live; this is the config I'd use.
#
# The pipeline only queues proposals, it never writes to the CRM, so running it
# unattended is safe. Review state (sync_state.db) is committed back to the
# repo so the next run knows what was already approved or rejected.
name: daily-sync

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = early morning US time, before reviewers start
  workflow_dispatch: {}

concurrency: daily-sync   # never two runs at once

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
      - run: python pipeline.py
        env:
          BELLHAVEN_TOKEN: ${{ secrets.BELLHAVEN_TOKEN }}
      - name: Save review state
        run: |
          git config user.name "bellhaven-sync"
          git config user.email "bellhaven-sync@users.noreply.github.com"
          git add sync_state.db
          git diff --cached --quiet || git commit -m "sync state $(date -u +%F)"
          git push
